# ═══════════════════════════════════════════════════════════════════════
# pve-updater — resources.conf
# ═══════════════════════════════════════════════════════════════════════
#
# Format:  ID | TYPE | NAME | IP | FLAGS
#
#   ID      CTID or VMID
#   TYPE    lxc  or  vm
#   NAME    Friendly name (for logs & notifications)
#   IP      Required for vm (SSH target). Leave empty for lxc.
#   FLAGS   Comma-separated:
#             apt     — run apt-get update & upgrade
#             docker  — find & update docker compose stacks
#             skip    — temporarily disable this entry
#
# Stopped containers/VMs are auto-skipped at runtime — no need to
# comment them out when you shut something down.
#
# To add a new resource: just append a line. To disable: add "skip".
# ═══════════════════════════════════════════════════════════════════════

# ── LXC Containers ──
101|lxc|homebridge||apt
102|lxc|karakeep||apt
103|lxc|adguard||apt
104|lxc|isponsorblocktv||apt
105|lxc|navidrome||apt
106|lxc|stirling-pdf||apt
107|lxc|proxmox-backup-server||apt
108|lxc|plex||apt
109|lxc|pairdrop||apt
110|lxc|ntfy||apt
111|lxc|openwebui||apt
112|lxc|debian||apt
114|lxc|ollama||apt
115|lxc|jellyfin||apt
116|lxc|dockge||apt,docker
117|lxc|paperless||apt,docker
119|lxc|n8n||apt
125|lxc|apache-guacamole||apt
126|lxc|python-ct||apt
127|lxc|komodo-docker||apt,docker

# ── QEMU VMs ──
# ⚠️  Replace CHANGE_ME with the actual IP address of each VM.
# SSH key-based auth must be set up first (see setup-ssh.sh).
123|vm|webserver-deb|CHANGE_ME|apt
124|vm|unifios|CHANGE_ME|apt

# ── Skipped / manually managed ──
# 100|vm|VM 100||skip
# 113|vm|haos||skip
