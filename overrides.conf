# ═══════════════════════════════════════════════════════════════════════
# pve-updater — overrides.conf  (optional)
# ═══════════════════════════════════════════════════════════════════════
#
# Guests are discovered automatically; you never list them here. This file
# only holds EXCEPTIONS. The same things can be done with Proxmox tags in
# the GUI (Datacenter → guest → Tags), which is usually more convenient:
#
#   tag           overrides.conf keyword   effect
#   no-update     skip                     never touch this guest
#   no-apt        no-apt                   skip OS package updates
#   no-docker     no-docker                skip Docker stack updates
#   no-snapshot   no-snapshot              don't snapshot before updating
#                 ip=<address>             VM only: SSH address, for VMs
#                                          without the QEMU guest agent
#
# Format:   <ID>|<keyword>[,<keyword>...]      Lines starting with # are ignored.
#
# Examples:
#   113|skip                  # haos: not apt based (it is auto-skipped anyway)
#   124|ip=192.168.1.1        # VM without guest agent, reach it via SSH
#   116|no-docker,no-snapshot # update apt only, and never snapshot it
# ═══════════════════════════════════════════════════════════════════════
